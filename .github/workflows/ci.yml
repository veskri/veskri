name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  quality:
    name: Quality checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            file \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            glslc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ubuntu-quality
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit
      - run: pnpm metadata:check
      - run: pnpm format:check
      - run: pnpm types
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  local-whisper-backends:
    name: Local Whisper (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan (Linux)
            runner: ubuntu-latest
            feature: local-whisper-vulkan
            cache_key: ubuntu-vulkan
            backend: vulkan-linux
          - name: Vulkan (Windows)
            runner: windows-latest
            feature: local-whisper-vulkan
            cache_key: windows-vulkan
            backend: vulkan-windows
          - name: CUDA (Windows)
            runner: windows-latest
            feature: local-whisper-cuda
            cache_key: windows-cuda
            backend: cuda-windows
          - name: CUDA (Linux)
            runner: ubuntu-latest
            feature: local-whisper-cuda
            cache_key: linux-cuda
            backend: cuda-linux
          - name: Metal
            runner: macos-26
            feature: local-whisper-metal
            cache_key: macos-metal
            backend: metal
          - name: Intel SYCL (Linux)
            runner: ubuntu-latest
            feature: local-whisper-intel-sycl
            cache_key: linux-intel-sycl
            backend: intel-sycl-linux
          - name: Intel SYCL (Windows)
            runner: windows-latest
            feature: local-whisper-intel-sycl
            cache_key: windows-intel-sycl
            backend: intel-sycl-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Vulkan build dependencies
        if: matrix.backend == 'vulkan-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            glslc
      - name: Install Windows Vulkan build dependencies
        if: matrix.backend == 'vulkan-windows'
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $vulkanSdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vulkanSdk) { throw 'The Vulkan SDK installation was not found.' }
          "VULKAN_SDK=$($vulkanSdk.FullName)" >> $env:GITHUB_ENV
          "$($vulkanSdk.FullName)\Bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=D:\v' >> $env:GITHUB_ENV
      - name: Install Windows CUDA build dependencies
        if: matrix.backend == 'cuda-windows'
        shell: pwsh
        run: |
          winget install --id Nvidia.CUDA --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $cuda = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cuda) { throw 'The CUDA Toolkit installation was not found.' }
          & "$($cuda.FullName)\bin\nvcc.exe" -V
          "CUDA_PATH=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CudaToolkitDir=$($cuda.FullName)\" >> $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CUDACXX=$($cuda.FullName)\bin\nvcc.exe" >> $env:GITHUB_ENV
          "$($cuda.FullName)\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=D:\veskri-ci-cuda-target' >> $env:GITHUB_ENV
      - name: Install Linux CUDA build dependencies
        if: matrix.backend == 'cuda-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            nvidia-cuda-toolkit \
            patchelf \
            rpm
          nvcc -V
          cuda_root="$(dirname "$(dirname "$(readlink -f "$(command -v nvcc)")")")"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
      - name: Install Windows Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl-windows'
        shell: pwsh
        run: |
          winget install --id Intel.OneAPI.BaseToolkit --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $oneapi = 'C:\Program Files (x86)\Intel\oneAPI'
          $setvars = Join-Path $oneapi 'setvars.bat'
          if (-not (Test-Path -LiteralPath $setvars)) { throw 'The Intel oneAPI Toolkit installation was not found.' }
          $environment = cmd /c "call `"$setvars`" intel64 >nul && set"
          foreach ($entry in $environment) {
            if ($entry -match '^PATH=(.*)$') {
              $env:PATH = $Matches[1]
              $Matches[1] -split ';' | Where-Object { $_ } | Add-Content -Path $env:GITHUB_PATH
            } elseif ($entry -match '^(ONEAPI_ROOT|CMPLR_ROOT|DPCPP_ROOT|MKLROOT|DNNLROOT|INCLUDE|LIB|LIBPATH)=(.*)$') {
              $entry | Add-Content -Path $env:GITHUB_ENV
            }
          }
          Get-Command icx.exe -ErrorAction Stop | Out-Null
          Get-Command icpx.exe -ErrorAction Stop | Out-Null
          Get-Command ninja.exe -ErrorAction Stop | Out-Null
          $syclcompat = Get-ChildItem -Path $oneapi -Recurse -File -Filter 'math.hpp' |
            Where-Object { $_.FullName -match '[\\/]include[\\/]syclcompat[\\/]math\.hpp$' } |
            Select-Object -First 1
          if (-not $syclcompat) { throw 'The Intel oneAPI SYCLcompat headers were not found.' }
          $syclcompatInclude = Split-Path (Split-Path $syclcompat.FullName -Parent) -Parent
          if ($env:CPLUS_INCLUDE_PATH) {
            $env:CPLUS_INCLUDE_PATH = "$syclcompatInclude;$env:CPLUS_INCLUDE_PATH"
          } else {
            $env:CPLUS_INCLUDE_PATH = $syclcompatInclude
          }
          "CPLUS_INCLUDE_PATH=$env:CPLUS_INCLUDE_PATH" >> $env:GITHUB_ENV
          $toolchain = Join-Path $env:RUNNER_TEMP 'veskri-intel-sycl-toolchain.cmake'
          @'
          set(CMAKE_C_COMPILER "icx" CACHE FILEPATH "" FORCE)
          set(CMAKE_CXX_COMPILER "icx" CACHE FILEPATH "" FORCE)
          '@ | Set-Content -LiteralPath $toolchain -NoNewline
          'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
          "CMAKE_TOOLCHAIN_FILE=$toolchain" >> $env:GITHUB_ENV
          'CMAKE_C_FLAGS=' >> $env:GITHUB_ENV
          'CMAKE_CXX_FLAGS=/EHsc' >> $env:GITHUB_ENV
          'CMAKE_ASM_FLAGS=' >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=D:\veskri-ci-intel-target' >> $env:GITHUB_ENV
      - name: Configure Windows C/C++ headers for Local Whisper bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          $resource = & $clang -print-resource-dir
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $resource -or -not $msvc -or -not $sdk) { throw 'Required Windows C/C++ headers were not found.' }
          $includes = @(
            "-isystem `"$resource\include`"",
            "-isystem `"$($msvc.FullName)\include`"",
            "-isystem `"$($sdk.FullName)\ucrt`"",
            "-isystem `"$($sdk.FullName)\shared`"",
            "-isystem `"$($sdk.FullName)\um`""
          ) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc=$includes" >> $env:GITHUB_ENV
      - name: Install Linux Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gpg \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libtbb-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp=2025.3.3-30 \
            intel-oneapi-dpcpp-ct=2025.3.1-18 \
            intel-oneapi-dnnl-devel=2025.3.0-409 \
            intel-oneapi-mkl-devel=2025.3.1-8
          source /opt/intel/oneapi/setvars.sh --force > /dev/null
          syclcompat_header="$(find /opt/intel/oneapi -path '*/include/syclcompat/math.hpp' -print -quit)"
          test -n "$syclcompat_header" || {
            echo "The Intel oneAPI SYCLcompat headers were not found."
            exit 1
          }
          syclcompat_include="$(dirname "$(dirname "$syclcompat_header")")"
          export CPLUS_INCLUDE_PATH="$syclcompat_include${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          tbb_config=''
          tbb_config="$(find /opt/intel/oneapi/tbb -type f -name TBBConfig.cmake -print -quit)"
          test -n "$tbb_config" || {
            echo "The Intel oneAPI TBB CMake package was not found."
            exit 1
          }
          TBB_DIR="$(dirname "$tbb_config")"
          export TBB_DIR
          {
            for variable in ONEAPI_ROOT CMPLR_ROOT DPCPP_ROOT MKLROOT DNNLROOT TBBROOT TBB_DIR CPATH CPLUS_INCLUDE_PATH LIBRARY_PATH LD_LIBRARY_PATH; do
              value="${!variable:-}"
              if [ -n "$value" ]; then
                echo "$variable=$value"
              fi
            done
          } >> "$GITHUB_ENV"
          tr ':' '\n' <<< "$PATH" >> "$GITHUB_PATH"
      - name: Install macOS Metal build dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew install llvm
          {
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib"
            echo "MACOSX_DEPLOYMENT_TARGET=26.0"
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=26.0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.cache_key }}
      - name: Compile the optional Local Whisper backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --features ${{ matrix.feature }}
